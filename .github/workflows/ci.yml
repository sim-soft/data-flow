name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip, dom, xmlwriter, simplexml, fileinfo, gd
          coverage: none
          ini-values: memory_limit=512M

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --prefer-dist

      - name: Run test suite
        run: composer test

  # The jobs above resolve to the newest release allowed by composer.json, so a
  # constraint that is too loose at the bottom goes unnoticed: declaring
  # "openspout/openspout: ^4.0" while calling an API added in 4.30 installs fine
  # here and fails for anyone pinned lower. This job installs the oldest allowed
  # version of every dependency so that gap surfaces in CI.
  #
  # Upper-bound breaks (OpenSpout 5 removing the Creator factories) are handled
  # by the "conflict" block in composer.json, not here — require-dev pins ^4.0,
  # so no resolution in this workflow can reach a v5.
  lowest-deps:
    name: Lowest allowed dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, dom, xmlwriter, simplexml, fileinfo, gd
          coverage: none
          ini-values: memory_limit=512M

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: lowest
          composer-options: --prefer-dist

      - name: Report resolved versions
        run: composer show --direct

      - name: Run test suite
        run: composer test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, dom, xmlwriter, simplexml, fileinfo, gd
          coverage: pcov
          ini-values: memory_limit=512M

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --prefer-dist

      - name: Measure coverage
        run: composer coverage

      # Fails if line coverage drops below the floor in scripts/coverage-check.php.
      # The floor is a ratchet set at the coverage that existed when it was
      # added — raise it as coverage improves, do not lower it to go green.
      - name: Enforce coverage floor
        run: php scripts/coverage-check.php

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  quality:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, dom, xmlwriter, simplexml, fileinfo, gd
          coverage: none
          ini-values: memory_limit=512M

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --prefer-dist

      - name: Run PHPStan and PHPMD
        run: composer qc
